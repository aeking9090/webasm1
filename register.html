<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | NovaCart</title>
    <meta name="description" content="Create a NovaCart account to save your profile, orders, and preferences." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #5b5cf6;
        --primary-dark: #3f41cd;
        --text: #162033;
        --muted: #64748b;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #f8f9ff, #eef2ff);
        min-height: 100vh;
      }

      .auth-card {
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 1.5rem;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
      }

      .text-error {
        color: #dc3545;
        font-size: 0.9rem;
      }

      .footer {
        background: #0f172a;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="auth-card p-4 p-lg-5 bg-white">
              <div class="text-center mb-4">
                <h1 class="fw-bold">Create your account</h1>
                <p class="text-muted mb-0">Join NovaCart and unlock faster checkout and a personalized experience.</p>
              </div>

              <form id="registerForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="name" class="form-label">Full name</label>
                    <input type="text" class="form-control" id="name" required />
                  </div>
                  <div class="col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" required />
                  </div>
                  <div class="col-12">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required />
                  </div>
                  <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required />
                  </div>
                  <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                    <input type="password" class="form-control" id="confirmPassword" required />
                  </div>
                  <div class="col-12">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" id="address" rows="3"></textarea>
                  </div>
                </div>
                <div id="errorMessage" class="text-error mt-3"></div>
                <button type="submit" class="btn btn-primary w-100 mt-4">Register</button>
              </form>

              <div class="text-center mt-4">
                <p class="mb-0 text-muted">Already have an account? <a href="login.html">Sign in</a></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">© 2026 NovaCart. All rights reserved.</p>
      </div>
    </footer>

    <script>
      const form = document.getElementById("registerForm");
      const errorMessage = document.getElementById("errorMessage");

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      function validatePhone(phone) {
        return /^\+?[0-9\s-]{7,15}$/.test(phone);
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        errorMessage.textContent = "";

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const address = document.getElementById("address").value.trim();

        if (!name || !phone || !email || !password || !confirmPassword) {
          errorMessage.textContent = "Please fill in all required fields.";
          return;
        }

        if (!validateEmail(email)) {
          errorMessage.textContent = "Please enter a valid email address.";
          return;
        }

        if (!validatePhone(phone)) {
          errorMessage.textContent = "Please enter a valid phone number.";
          return;
        }

        if (password.length < 6) {
          errorMessage.textContent = "Password must be at least 6 characters.";
          return;
        }

        if (password !== confirmPassword) {
          errorMessage.textContent = "Passwords do not match.";
          return;
        }

        const users = JSON.parse(localStorage.getItem("novaUsers") || "[]");
        const existing = users.find((user) => user.email === email);

        if (existing) {
          errorMessage.textContent = "An account with this email already exists.";
          return;
        }

        const newUser = { name, phone, email, password, address };
        users.push(newUser);
        localStorage.setItem("novaUsers", JSON.stringify(users));
        localStorage.setItem("novaSession", JSON.stringify({ name, email }));
        window.location.href = "profile.html";
      });
    </script>
  </body>
</html>
