<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | NovaCart</title>
    <meta name="description" content="Manage your NovaCart profile information and preferences." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #5b5cf6;
        --primary-dark: #3f41cd;
        --text: #162033;
        --muted: #64748b;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text);
        background: #f8f9ff;
      }

      .navbar {
        backdrop-filter: blur(14px);
        background: rgba(255, 255, 255, 0.9) !important;
        border-bottom: 1px solid rgba(91, 92, 246, 0.08);
      }

      .navbar-brand {
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--primary) !important;
      }

      .card-soft {
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 1.4rem;
        box-shadow: 0 16px 36px rgba(15, 23, 42, 0.06);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
      }

      .avatar-wrap {
        position: relative;
      }

      .avatar-trigger {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        background: rgba(91, 92, 246, 0.1);
        border: 1px solid rgba(91, 92, 246, 0.14);
        color: var(--primary);
        cursor: pointer;
        min-width: 150px;
      }

      .avatar-badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-weight: 700;
        flex-shrink: 0;
      }

      .avatar-menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        min-width: 190px;
        background: #fff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 1rem;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.12);
        padding: 0.6rem;
        display: none;
        z-index: 1200;
        max-height: 180px;
        overflow-y: auto;
      }

      .avatar-menu.show {
        display: block;
      }

      .avatar-menu .menu-name {
        font-weight: 700;
        padding: 0.4rem 0.5rem 0.65rem;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        margin-bottom: 0.4rem;
      }

      .avatar-menu button {
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: #dc2626;
        padding: 0.55rem 0.5rem;
        border-radius: 0.65rem;
        font-weight: 600;
      }

      .avatar-menu button:hover {
        background: rgba(220, 38, 38, 0.08);
      }

      .footer {
        background: #0f172a;
        color: #cbd5e1;
      }

      .avatar {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 700;
        overflow: hidden;
      }

      .avatar-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      .avatar-wrap {
        position: relative;
      }

      .avatar-trigger {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        background: rgba(91, 92, 246, 0.1);
        border: 1px solid rgba(91, 92, 246, 0.14);
        color: var(--primary);
        cursor: pointer;
        min-width: 150px;
      }

      .avatar-badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-weight: 700;
        flex-shrink: 0;
      }

      .avatar-menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        min-width: 190px;
        background: #fff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 1rem;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.12);
        padding: 0.6rem;
        display: none;
        z-index: 1200;
        max-height: 180px;
        overflow-y: auto;
      }

      .avatar-menu.show {
        display: block;
      }

      .avatar-menu .menu-name {
        font-weight: 700;
        padding: 0.4rem 0.5rem 0.65rem;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        margin-bottom: 0.4rem;
      }

      .avatar-menu button {
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: #dc2626;
        padding: 0.55rem 0.5rem;
        border-radius: 0.65rem;
        font-weight: 600;
      }

      .avatar-menu button:hover {
        background: rgba(220, 38, 38, 0.08);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand fs-3" href="index.html">NovaCart</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link active" href="./profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="./login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="./register.html">Register</a></li>
            <li class="nav-item avatar-wrap" id="avatarNavItem" style="display: none">
              <div class="avatar-trigger" id="avatarTrigger" role="button" tabindex="0" aria-expanded="false">
                <span class="avatar-badge" id="avatarInitial">U</span>
                <span class="fw-semibold d-none d-lg-inline" id="avatarName">User</span>
              </div>
              <div class="avatar-menu" id="avatarMenu">
                <div class="menu-name" id="avatarMenuName">Customer</div>
                <button type="button" id="logoutBtn">Logout</button>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card-soft p-4 bg-white">
              <div class="d-flex align-items-center gap-3 mb-4">
                <div class="avatar" id="profileAvatarDisplay">U</div>
                <div>
                  <h3 class="fw-bold mb-1" id="profileName">User</h3>
                  <p class="text-muted mb-0" id="profileEmail">email@example.com</p>
                  <div class="d-flex flex-column gap-2 mt-2">
                    <input type="file" class="form-control form-control-sm" id="avatarUpload" accept="image/*" />
                    <button type="button" class="btn btn-sm btn-outline-primary" id="uploadAvatarBtn" disabled>Upload</button>
                    <small class="text-muted">Choose an image, then click Upload to preview it before saving.</small>
                  </div>
                </div>
              </div>
              <div class="list-group list-group-flush">
                <div class="list-group-item px-0">
                  <strong>Member since:</strong> <span class="text-muted">2026</span>
                </div>
                <div class="list-group-item px-0">
                  <strong>Rewards:</strong> <span class="text-muted">Gold tier</span>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card-soft p-4 p-lg-5 bg-white">
              <h2 class="fw-bold mb-4">My profile</h2>
              <form id="profileForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Full name</label>
                    <input type="text" class="form-control" id="name" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" id="address" rows="3"></textarea>
                  </div>
                </div>
                <div class="d-flex flex-wrap gap-3 mt-4">
                  <button type="submit" class="btn btn-primary">Save Changes</button>
                  <button type="button" class="btn btn-outline-secondary" id="backButton">Back</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">© 2026 NovaCart. All rights reserved.</p>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const session = JSON.parse(localStorage.getItem("novaSession") || "null");
        const users = JSON.parse(localStorage.getItem("novaUsers") || "[]");
        const avatarUpload = document.getElementById("avatarUpload");
        const uploadAvatarBtn = document.getElementById("uploadAvatarBtn");
        const profileAvatarDisplay = document.getElementById("profileAvatarDisplay");
        const avatarNavItem = document.getElementById("avatarNavItem");
        const avatarTrigger = document.getElementById("avatarTrigger");
        const avatarInitial = document.getElementById("avatarInitial");
        const avatarName = document.getElementById("avatarName");
        const avatarMenuName = document.getElementById("avatarMenuName");
        const avatarMenu = document.getElementById("avatarMenu");
        const logoutBtn = document.getElementById("logoutBtn");
        const loginLink = document.querySelector('.nav-link[href="./login.html"]');
        const registerLink = document.querySelector('.nav-link[href="./register.html"]');
        const profileForm = document.getElementById("profileForm");
        const isAuthPage = /\/(login|register)\.html$/i.test(window.location.pathname);

        if (!session || !session.email) {
          window.location.href = "./login.html";
          return;
        }

        let currentUser = users.find((user) => user.email === session.email) || null;

        if (!currentUser) {
          window.location.href = "./login.html";
          return;
        }

        let selectedAvatarFile = null;
        let previewAvatar = currentUser.avatar || null;

        function renderAvatarElement(element, avatarValue, fallbackText) {
          if (!element) return;
          element.innerHTML = "";

          if (avatarValue && typeof avatarValue === "string" && avatarValue.startsWith("data:image")) {
            const img = document.createElement("img");
            img.src = avatarValue;
            img.alt = "User avatar";
            img.className = "avatar-image";
            element.appendChild(img);
          } else {
            element.textContent = avatarValue || fallbackText || "U";
          }
        }

        function updateAvatarMenu() {
          const sessionData = JSON.parse(localStorage.getItem("novaSession") || "null");

          if (!sessionData || isAuthPage) {
            avatarNavItem.style.display = "none";
            if (loginLink) loginLink.parentElement.style.display = "block";
            if (registerLink) registerLink.parentElement.style.display = "block";
            return;
          }

          const fullName = sessionData.name || sessionData.email?.split("@")[0] || "Customer";
          const avatarValue = sessionData.avatar || (sessionData.name ? sessionData.name.charAt(0).toUpperCase() : "U");
          renderAvatarElement(avatarInitial, avatarValue, "U");
          avatarName.textContent = fullName;
          avatarMenuName.textContent = fullName;
          renderAvatarElement(profileAvatarDisplay, avatarValue, fullName.charAt(0).toUpperCase());
          avatarNavItem.style.display = "flex";

          if (loginLink) loginLink.parentElement.style.display = "none";
          if (registerLink) registerLink.parentElement.style.display = "none";
        }

        function toggleAvatarMenu() {
          const isOpen = avatarMenu.classList.toggle("show");
          avatarTrigger.setAttribute("aria-expanded", String(isOpen));
        }

        function loadProfile() {
          document.getElementById("profileName").textContent = currentUser.name;
          document.getElementById("profileEmail").textContent = currentUser.email;
          document.getElementById("name").value = currentUser.name;
          document.getElementById("phone").value = currentUser.phone || "";
          document.getElementById("email").value = currentUser.email;
          document.getElementById("address").value = currentUser.address || "";
          renderAvatarElement(profileAvatarDisplay, previewAvatar, currentUser.name.charAt(0).toUpperCase());
        }

        avatarUpload.addEventListener("change", function () {
          const file = this.files[0];
          if (!file) {
            selectedAvatarFile = null;
            uploadAvatarBtn.disabled = true;
            return;
          }

          selectedAvatarFile = file;
          uploadAvatarBtn.disabled = false;
        });

        uploadAvatarBtn.addEventListener("click", function () {
          if (!selectedAvatarFile) return;

          const reader = new FileReader();
          reader.onload = function (event) {
            previewAvatar = event.target.result;
            renderAvatarElement(profileAvatarDisplay, previewAvatar, currentUser.name.charAt(0).toUpperCase());
          };
          reader.readAsDataURL(selectedAvatarFile);
        });

        document.getElementById("backButton").addEventListener("click", function () {
          window.location.href = "./index.html";
        });

        if (avatarTrigger) {
          avatarTrigger.addEventListener("click", toggleAvatarMenu);
          avatarTrigger.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggleAvatarMenu();
            }
          });
        }

        document.addEventListener("click", (event) => {
          if (!avatarNavItem.contains(event.target)) {
            avatarMenu.classList.remove("show");
            avatarTrigger.setAttribute("aria-expanded", "false");
          }
        });

        if (logoutBtn) {
          logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("novaSession");
            window.location.href = "./login.html";
          });
        }

        updateAvatarMenu();
        loadProfile();

        window.addEventListener("pageshow", function () {
          updateAvatarMenu();
          const sessionData = JSON.parse(localStorage.getItem("novaSession") || "null");
          if (!sessionData || !sessionData.email) {
            window.location.href = "./login.html";
          }
        });

        if (profileForm) {
          profileForm.addEventListener("submit", function (event) {
            event.preventDefault();

            currentUser = {
              ...currentUser,
              name: document.getElementById("name").value.trim(),
              phone: document.getElementById("phone").value.trim(),
              email: document.getElementById("email").value.trim(),
              address: document.getElementById("address").value.trim(),
              avatar: previewAvatar || currentUser.avatar || null,
              password: currentUser.password
            };

            const updatedUsers = users.map((user) => {
              if (user.email === session.email) {
                return currentUser;
              }
              return user;
            });

            localStorage.setItem("novaUsers", JSON.stringify(updatedUsers));
            localStorage.setItem("novaSession", JSON.stringify({
              name: currentUser.name,
              email: currentUser.email,
              avatar: currentUser.avatar || null
            }));

            loadProfile();
            updateAvatarMenu();
            uploadAvatarBtn.disabled = true;
            selectedAvatarFile = null;
            alert("Profile saved successfully.");
          });
        }

        updateAvatarMenu();
        loadProfile();
      });
    </script>
  </body>
</html>
