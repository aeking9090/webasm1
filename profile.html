<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | NovaCart</title>
    <meta name="description" content="Manage your NovaCart profile information and preferences." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #5b5cf6;
        --primary-dark: #3f41cd;
        --text: #162033;
        --muted: #64748b;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text);
        background: #f8f9ff;
      }

      .card-soft {
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 1.4rem;
        box-shadow: 0 16px 36px rgba(15, 23, 42, 0.06);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
      }

      .footer {
        background: #0f172a;
        color: #cbd5e1;
      }

      .avatar {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="py-5">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card-soft p-4 bg-white">
              <div class="d-flex align-items-center gap-3 mb-4">
                <div class="avatar" id="avatarInitial">U</div>
                <div>
                  <h3 class="fw-bold mb-1" id="profileName">User</h3>
                  <p class="text-muted mb-0" id="profileEmail">email@example.com</p>
                </div>
              </div>
              <div class="list-group list-group-flush">
                <div class="list-group-item px-0">
                  <strong>Member since:</strong> <span class="text-muted">2026</span>
                </div>
                <div class="list-group-item px-0">
                  <strong>Rewards:</strong> <span class="text-muted">Gold tier</span>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card-soft p-4 p-lg-5 bg-white">
              <h2 class="fw-bold mb-4">My profile</h2>
              <form id="profileForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Full name</label>
                    <input type="text" class="form-control" id="name" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" id="address" rows="3"></textarea>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary mt-4">Save Changes</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">© 2026 NovaCart. All rights reserved.</p>
      </div>
    </footer>

    <script>
      const session = JSON.parse(localStorage.getItem("novaSession") || "null");
      const users = JSON.parse(localStorage.getItem("novaUsers") || "[]");

      if (!session) {
        window.location.href = "login.html";
      }

      const currentUser = users.find((user) => user.email === session.email) || null;

      if (!currentUser) {
        window.location.href = "login.html";
      }

      document.getElementById("profileName").textContent = currentUser.name;
      document.getElementById("profileEmail").textContent = currentUser.email;
      document.getElementById("avatarInitial").textContent = currentUser.name.charAt(0).toUpperCase();

      document.getElementById("name").value = currentUser.name;
      document.getElementById("phone").value = currentUser.phone || "";
      document.getElementById("email").value = currentUser.email;
      document.getElementById("address").value = currentUser.address || "";

      document.getElementById("profileForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const updatedUser = {
          ...currentUser,
          name: document.getElementById("name").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          email: document.getElementById("email").value.trim(),
          address: document.getElementById("address").value.trim()
        };

        const updatedUsers = users.map((user) => (user.email === currentUser.email ? updatedUser : user));
        localStorage.setItem("novaUsers", JSON.stringify(updatedUsers));
        localStorage.setItem("novaSession", JSON.stringify({ name: updatedUser.name, email: updatedUser.email }));

        document.getElementById("profileName").textContent = updatedUser.name;
        document.getElementById("profileEmail").textContent = updatedUser.email;
        document.getElementById("avatarInitial").textContent = updatedUser.name.charAt(0).toUpperCase();
        alert("Profile updated successfully.");
      });
    </script>
  </body>
</html>
