<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | NovaCart</title>
    <meta name="description" content="Sign in to your NovaCart account to manage orders and profile details." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #5b5cf6;
        --primary-dark: #3f41cd;
        --text: #162033;
        --muted: #64748b;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #f8f9ff, #eef2ff);
        min-height: 100vh;
      }

      .navbar {
        backdrop-filter: blur(14px);
        background: rgba(255, 255, 255, 0.9) !important;
        border-bottom: 1px solid rgba(91, 92, 246, 0.08);
      }

      .navbar-brand {
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--primary) !important;
      }

      .auth-card {
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 1.5rem;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
      }

      .avatar-wrap {
        position: relative;
      }

      .avatar-trigger {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        background: rgba(91, 92, 246, 0.1);
        border: 1px solid rgba(91, 92, 246, 0.14);
        color: var(--primary);
        cursor: pointer;
        min-width: 150px;
      }

      .avatar-badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-weight: 700;
        flex-shrink: 0;
        overflow: hidden;
      }

      .avatar-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      .avatar-menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        min-width: 190px;
        background: #fff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 1rem;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.12);
        padding: 0.6rem;
        display: none;
        z-index: 1200;
        max-height: 180px;
        overflow-y: auto;
      }

      .avatar-menu.show {
        display: block;
      }

      .avatar-menu .menu-name {
        font-weight: 700;
        padding: 0.4rem 0.5rem 0.65rem;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        margin-bottom: 0.4rem;
      }

      .avatar-menu button {
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: #dc2626;
        padding: 0.55rem 0.5rem;
        border-radius: 0.65rem;
        font-weight: 600;
      }

      .avatar-menu button:hover {
        background: rgba(220, 38, 38, 0.08);
      }

      .footer {
        background: #0f172a;
        color: #cbd5e1;
      }

      .text-error {
        color: #dc3545;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand fs-3" href="index.html">NovaCart</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="./profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link active" href="./login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="./register.html">Register</a></li>
            <li class="nav-item avatar-wrap" id="avatarNavItem" style="display: none">
              <div class="avatar-trigger" id="avatarTrigger" role="button" tabindex="0" aria-expanded="false">
                <span class="avatar-badge" id="avatarInitial">U</span>
                <span class="fw-semibold d-none d-lg-inline" id="avatarName">User</span>
              </div>
              <div class="avatar-menu" id="avatarMenu">
                <div class="menu-name" id="avatarMenuName">Customer</div>
                <button type="button" id="logoutBtn">Logout</button>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5">
            <div class="auth-card p-4 p-lg-5 bg-white">
              <div class="text-center mb-4">
                <h1 class="fw-bold">Welcome back</h1>
                <p class="text-muted mb-0">Sign in to continue your stylish journey.</p>
              </div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email" required />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" required />
                </div>
                <div id="errorMessage" class="text-error mb-3"></div>
                <button type="submit" class="btn btn-primary w-100">Log In</button>
              </form>

              <div class="text-center mt-4">
                <p class="mb-0 text-muted">Don’t have an account? <a href="register.html">Create one</a></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">© 2026 NovaCart. All rights reserved.</p>
      </div>
    </footer>

    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const errorMessage = document.getElementById("errorMessage");
      const avatarNavItem = document.getElementById("avatarNavItem");
      const avatarTrigger = document.getElementById("avatarTrigger");
      const avatarInitial = document.getElementById("avatarInitial");
      const avatarName = document.getElementById("avatarName");
      const avatarMenuName = document.getElementById("avatarMenuName");
      const avatarMenu = document.getElementById("avatarMenu");
      const logoutBtn = document.getElementById("logoutBtn");
      const loginLink = document.querySelector('.nav-link[href="./login.html"]');
      const registerLink = document.querySelector('.nav-link[href="./register.html"]');
      const isAuthPage = /\/(login|register)\.html$/i.test(window.location.pathname);

      function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      function renderAvatarElement(element, avatarValue, fallbackText) {
        if (!element) return;

        element.innerHTML = "";

        if (avatarValue && typeof avatarValue === "string" && avatarValue.startsWith("data:image")) {
          const img = document.createElement("img");
          img.src = avatarValue;
          img.alt = "User avatar";
          img.className = "rounded-circle object-fit-cover";
          img.style.width = "100%";
          img.style.height = "100%";
          element.appendChild(img);
          return;
        }

        const text = document.createElement("span");
        text.textContent = (avatarValue && typeof avatarValue === "string" && avatarValue.trim()) ? avatarValue : fallbackText;
        text.className = "fw-semibold";
        element.appendChild(text);
      }

      function updateAvatarMenu() {
        const session = JSON.parse(localStorage.getItem("novaSession") || "null");

        if (!session || isAuthPage) {
          avatarNavItem.style.display = "none";
          if (loginLink) loginLink.parentElement.style.display = "block";
          if (registerLink) registerLink.parentElement.style.display = "block";
          return;
        }

        const fullName = session.name || session.email?.split("@")[0] || "Customer";
        const avatarValue = session.avatar || (session.name ? session.name.charAt(0).toUpperCase() : "U");
        renderAvatarElement(avatarInitial, avatarValue, "U");
        avatarName.textContent = fullName;
        avatarMenuName.textContent = fullName;
        avatarNavItem.style.display = "flex";

        if (loginLink) loginLink.parentElement.style.display = "none";
        if (registerLink) registerLink.parentElement.style.display = "none";
      }

      function toggleAvatarMenu() {
        const isOpen = avatarMenu.classList.toggle("show");
        avatarTrigger.setAttribute("aria-expanded", String(isOpen));
      }

      if (avatarTrigger) {
        avatarTrigger.addEventListener("click", toggleAvatarMenu);
        avatarTrigger.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleAvatarMenu();
          }
        });
      }

      document.addEventListener("click", (event) => {
        if (!avatarNavItem.contains(event.target)) {
          avatarMenu.classList.remove("show");
          avatarTrigger.setAttribute("aria-expanded", "false");
        }
      });

      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("novaSession");
          window.location.href = "./login.html";
        });
      }

      updateAvatarMenu();

      window.addEventListener("pageshow", function () {
        updateAvatarMenu();
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        errorMessage.textContent = "";

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!validateEmail(email)) {
          errorMessage.textContent = "Please enter a valid email address.";
          return;
        }

        if (password.length < 6) {
          errorMessage.textContent = "Password must be at least 6 characters.";
          return;
        }

        const users = JSON.parse(localStorage.getItem("novaUsers") || "[]");
        const match = users.find((user) => user.email === email && user.password === password);

        if (!match) {
          errorMessage.textContent = "No matching account found. Please register first.";
          return;
        }

        localStorage.setItem("novaSession", JSON.stringify({ email, name: match.name, avatar: match.avatar || null }));
        window.location.href = "./index.html";
      });
    </script>
  </body>
</html>
