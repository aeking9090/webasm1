<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cart | NovaCart</title>
    <meta name="description" content="Review your selected items and complete checkout with NovaCart." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #5b5cf6;
        --primary-dark: #3f41cd;
        --text: #162033;
        --muted: #64748b;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--text);
        background: #f8f9ff;
      }

      .card-soft {
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 1.4rem;
        box-shadow: 0 16px 36px rgba(15, 23, 42, 0.06);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
      }

      .footer {
        background: #0f172a;
        color: #cbd5e1;
      }

      .cart-image {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="py-5">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="fw-bold">My cart</h1>
            <p class="text-muted mb-0">Review your selections and place your order.</p>
          </div>
          <button class="btn btn-outline-danger" id="clearCartBtn">Clear Cart</button>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card-soft p-4 bg-white" id="cartItems"></div>
          </div>
          <div class="col-lg-4">
            <div class="card-soft p-4 bg-white">
              <h4 class="fw-bold mb-4">Order Summary</h4>
              <div class="d-flex justify-content-between mb-2">
                <span>Subtotal</span>
                <span id="subtotal">$0.00</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Tax</span>
                <span id="tax">$0.00</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between fw-bold fs-5">
                <span>Total</span>
                <span id="total">$0.00</span>
              </div>
              <button class="btn btn-primary w-100 mt-4" id="checkoutBtn">Checkout</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">© 2026 NovaCart. All rights reserved.</p>
      </div>
    </footer>

    <script>
      const cartItemsContainer = document.getElementById("cartItems");
      const subtotalEl = document.getElementById("subtotal");
      const taxEl = document.getElementById("tax");
      const totalEl = document.getElementById("total");
      const clearCartBtn = document.getElementById("clearCartBtn");
      const checkoutBtn = document.getElementById("checkoutBtn");

      function formatVND(value) {
        return new Intl.NumberFormat("vi-VN", {
          style: "currency",
          currency: "VND",
          maximumFractionDigits: 0
        }).format(value);
      }

      function getCart() {
        return JSON.parse(localStorage.getItem("novaCart") || "[]");
      }

      function saveCart(cart) {
        localStorage.setItem("novaCart", JSON.stringify(cart));
      }

      function renderCart() {
        const cart = getCart();
        cartItemsContainer.innerHTML = "";

        if (cart.length === 0) {
          cartItemsContainer.innerHTML = `
            <div class="text-center py-5">
              <h4 class="fw-bold">Your cart is empty</h4>
              <p class="text-muted">Add some favorites from the shop to get started.</p>
              <a href="index.html" class="btn btn-primary mt-3">Continue Shopping</a>
            </div>`;
          updateSummary(0);
          return;
        }

        cart.forEach((item) => {
          const row = document.createElement("div");
          row.className = "d-flex justify-content-between align-items-center border-bottom py-3";
          row.innerHTML = `
            <div class="d-flex align-items-center gap-3">
              <img src="${item.image}" alt="${item.name}" class="cart-image" />
              <div>
                <h6 class="fw-bold mb-1">${item.name}</h6>
                <p class="text-muted mb-0">${formatVND(item.price)}</p>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-outline-secondary btn-sm" data-action="decrease" data-id="${item.id}">-</button>
              <span class="fw-bold px-2">${item.quantity}</span>
              <button class="btn btn-outline-secondary btn-sm" data-action="increase" data-id="${item.id}">+</button>
            </div>
            <div class="text-end">
              <div class="fw-bold">${formatVND(item.price * item.quantity)}</div>
              <button class="btn btn-link text-danger p-0 mt-1" data-action="remove" data-id="${item.id}">Remove</button>
            </div>
          `;
          cartItemsContainer.appendChild(row);
        });

        updateSummary(cart.reduce((sum, item) => sum + item.price * item.quantity, 0));
      }

      function updateSummary(subtotal) {
        const tax = subtotal * 0.08;
        const total = subtotal + tax;
        subtotalEl.textContent = formatVND(subtotal);
        taxEl.textContent = formatVND(tax);
        totalEl.textContent = formatVND(total);
      }

      cartItemsContainer.addEventListener("click", function (event) {
        const button = event.target.closest("button");
        if (!button) return;

        const { action, id } = button.dataset;
        const cart = getCart();

        if (action === "increase") {
          const item = cart.find((entry) => entry.id === Number(id));
          if (item) item.quantity += 1;
        }

        if (action === "decrease") {
          const item = cart.find((entry) => entry.id === Number(id));
          if (item && item.quantity > 1) item.quantity -= 1;
          else if (item) {
            const filtered = cart.filter((entry) => entry.id !== Number(id));
            saveCart(filtered);
            renderCart();
            return;
          }
        }

        if (action === "remove") {
          const filtered = cart.filter((entry) => entry.id !== Number(id));
          saveCart(filtered);
          renderCart();
          return;
        }

        saveCart(cart);
        renderCart();
      });

      clearCartBtn.addEventListener("click", function () {
        saveCart([]);
        renderCart();
      });

      checkoutBtn.addEventListener("click", async function () {
        const cart = getCart();

        if (cart.length === 0) {
          alert("Your cart is empty.");
          return;
        }

        const session = JSON.parse(localStorage.getItem("novaSession") || "null");
        const customer = session ? { name: session.name, email: session.email } : { name: "Guest" };

        try {
          const response = await fetch("/api/checkout", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ items: cart, customer })
          });

          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "Checkout failed");

          saveCart([]);
          renderCart();
          alert(`${result.message}\nTotal: ${formatVND(result.total)}`);
        } catch (error) {
          console.error(error);
          alert("Checkout failed. Please try again.");
        }
      });

      renderCart();
    </script>
  </body>
</html>
